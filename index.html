        .btn-primary { background: #ff7043; flex: 2; }

        { type: "2字母", combo: "fl", ipa: "/fl/", rule: "辅音连缀。", examples: "flag, fly" },

    const extendedPhonicsRules = {
        "a_e": { ipa: "/eɪ/", rule: "Magic E，a_e发/eɪ/。", examples: "name, cake" },
        "e_e": { ipa: "/iː/", rule: "Magic E，e_e发/iː/。", examples: "these, theme" },
        "i_e": { ipa: "/aɪ/", rule: "Magic E，i_e发/aɪ/。", examples: "bite, kite" },
        "o_e": { ipa: "/əʊ/", rule: "Magic E，o_e发/əʊ/。", examples: "rose, home" },
        "u_e": { ipa: "/juː/", rule: "Magic E，u_e发/juː/。", examples: "cute, tube" },
        "a": { ipa: "/æ/ 或 /eɪ/", rule: "闭音节发/æ/，开音节发/eɪ/。", examples: "cat, name" },
        "e": { ipa: "/e/ 或 /iː/", rule: "闭音节发/e/，开音节发/iː/。", examples: "bed, he" },
        "i": { ipa: "/ɪ/ 或 /aɪ/", rule: "闭音节发/ɪ/，开音节发/aɪ/。", examples: "pig, hi" },
        "o": { ipa: "/ɒ/ 或 /əʊ/", rule: "闭音节发/ɒ/，开音节发/əʊ/。", examples: "frog, go" },
        "u": { ipa: "/ʌ/ 或 /juː/", rule: "闭音节发/ʌ/，开音节发/juː/。", examples: "bus, cute" },
        "c": { ipa: "/k/ 或 /s/", rule: "a/o/u前发/k/，e/i/y前发/s/。", examples: "cat, city" },
        "g": { ipa: "/ɡ/ 或 /dʒ/", rule: "a/o/u前发/ɡ/，e/i/y前发/dʒ/。", examples: "go, gym" },
        "y": { ipa: "/j/ 或 /aɪ/", rule: "词首发/j/，词尾发/aɪ/。", examples: "yes, my" }
    };

    // ==========================================================
    // 三、动态拆词与规则解析引擎
    // ==========================================================
    function splitWordToChunks(word) {
        const chunks = [];
        let i = 0;
        const w = word.toLowerCase();
        while (i < w.length) {
            let matched = false;
            // 1. 优先匹配 Magic E (如 a_e)
            if (i + 2 < w.length && w[i+2] === 'e') {
                const magicKey = w[i] + '_e';
                if (extendedPhonicsRules[magicKey]) {
                    chunks.push(w.substring(i, i+3)); i += 3; matched = true; continue;
                }
            }
            // 2. 优先匹配 4 字母组合
            if (i + 4 <= w.length) {
                const sub4 = w.substring(i, i + 4);
                if (phonicsCombosData.find(c => c.combo === sub4)) { chunks.push(sub4); i += 4; matched = true; continue; }
            }
            // 3. 优先匹配 3 字母组合
            if (i + 3 <= w.length) {
                const sub3 = w.substring(i, i + 3);
                if (phonicsCombosData.find(c => c.combo === sub3)) { chunks.push(sub3); i += 3; matched = true; continue; }
            }
            // 4. 优先匹配 2 字母组合
            if (i + 2 <= w.length) {
                const sub2 = w.substring(i, i + 2);
                if (phonicsCombosData.find(c => c.combo === sub2) || extendedPhonicsRules[sub2]) { chunks.push(sub2); i += 2; matched = true; continue; }
            }
            // 5. 单字母处理
            if (!matched) { chunks.push(w[i]); i++; }
        }
        return chunks;
    }

    // 生成解析步骤的 HTML
    function generateAnalysisSteps(word, predefinedSplit = null) {
        const chunks = predefinedSplit && predefinedSplit.length > 0 ? predefinedSplit : splitWordToChunks(word);
        const letters = word.split('').join(' - ');
        
        let html = `
            <div class="step-card whole">
                <div class="step-title">第一步：找元音，划音节 & 第二步：找辅音定组合</div>
                <div class="step-content">
                    ${chunks.join('·')}（约${chunks.filter(c => /[aeiouy]/i.test(c)).length}音节）<br>
                    【动态强制划词(降序法则)】：${chunks.join(' - ')}
                </div>
            </div>
            <div class="step-card whole">
                <div class="step-title">第三步：组拼读块 & 第四步：套规则发音</div>
                <div class="step-content">
                    全词字母拆解：${letters}<br>
                    组拼读块划分：${chunks.join(' - ')}
                </div>
            </div>
            <div style="margin-top: 15px;">
                <div class="step-title" style="margin-bottom: 10px; font-size: 16px; color: #558b2f;">【划词块发音规则解析】：</div>
        `;
        
        let comboReasonsHTML = '';
        
        for (const chunk of chunks) {
            let ruleData = phonicsCombosData.find(c => c.combo === chunk) || extendedPhonicsRules[chunk];
            if (ruleData) {
                const ipaStr = ruleData.ipa || '';
                const ruleStr = ruleData.rule || '';
                const examplesStr = ruleData.examples || '';
                html += `
                    <div class="step-card combo" style="margin-bottom: 8px;">
                        <div class="step-title">▶ 块【${chunk}】拆解与发音规则：</div>
                        <div class="step-content">
                            - [${chunk}]：发 ${ipaStr}。 规则:${ruleStr} 例:${examplesStr}。
                        </div>
                    </div>
                `;
                if (phonicsCombosData.find(c => c.combo === chunk)) {
                    comboReasonsHTML += `<div style="margin-bottom: 5px;">【${chunk}组合】${ruleStr} 例:${examplesStr}。</div>`;
                }
            } else {
                html += `
                    <div class="step-card" style="margin-bottom: 8px;">
                        <div class="step-title">▶ 块【${chunk}】拆解与发音规则：</div>
                        <div class="step-content">- [${chunk}]：常见单字母发音规则。</div>
                    </div>
                `;
            }
        }
        
        html += `
            </div>
            <div class="step-card combo" style="margin-top: 15px;">
                <div class="step-title">组合发音解析与口诀</div>
                <div class="step-content">${comboReasonsHTML || '<div>无特殊组合口诀。</div>'}</div>
            </div>
            <div class="step-card" style="margin-top: 15px;">
                <div class="step-title">第五步：定重音</div>
                <div class="step-content">(名词/形容词常在第1音节，动词常在第2音节，参考音标 ' 符号)</div>
            </div>
        `;
        
        return html;
    }

    // ==========================================================
    // 四、GitHub 词库自动加载与切换
    // ==========================================================
    async function loadGradeList() {
        try {
            const res = await fetch(API_URL);
            if (!res.ok) throw new Error("网络错误");
            const data = await res.json();
            const files = data.filter(f => f.name.endsWith('.json')).sort((a, b) => a.name.localeCompare(b.name));
            
            const box = document.getElementById("gradeButtons");
            box.innerHTML = "";
            if (files.length === 0) {
                box.innerHTML = '<div style="color:red; font-size:14px;">未在 data 文件夹找到词库文件</div>';
                return;
            }
            files.forEach(file => {
                const btn = document.createElement("button");
                btn.className = "grade-btn";
                btn.textContent = file.name.replace('.json', '');
                btn.onclick = () => loadGrade(file.download_url, file.name.replace('.json', ''), btn);
                box.appendChild(btn);
            });
        } catch (err) {
            document.getElementById("gradeButtons").innerHTML = '<div style="color:red; font-size:14px;">词库列表加载失败</div>';
        }
    }

    async function loadGrade(url, name, btn) {
        document.querySelectorAll(".grade-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        try {
            const res = await fetch(url);
            currentPhonics = await res.json();
            currentGradeName = name;
            currentWordKeys = Object.keys(currentPhonics);
            
            document.getElementById('wordContent').style.display = 'block';
            document.getElementById('analysisPanel').style.display = 'none';
            currentIndex = 0;
            displayCurrentWord();
        } catch (err) {
            alert("加载词库失败");
        }
    }

    function displayCurrentWord() {
        if (currentWordKeys.length === 0) return;
        const word = currentWordKeys[currentIndex];
        const data = currentPhonics[word];
        document.getElementById('wordIndex').textContent = `第 ${currentIndex + 1} / ${currentWordKeys.length} 个`;
        document.getElementById('wordText').textContent = word;
        document.getElementById('wordMeaning').textContent = Array.isArray(data) ? `拆分: ${data.join('-')}` : '';
        document.getElementById('analysisPanel').style.display = 'none';
    }

    // ==========================================================
    // 五、单词解析与发音控制
    // ==========================================================
    function analyzeCurrentWord() {
        if (currentWordKeys.length === 0) return;
        const word = currentWordKeys[currentIndex];
        const predefinedSplit = Array.isArray(currentPhonics[word]) ? currentPhonics[word] : null;
        
        const panel = document.getElementById('analysisPanel');
        const stepsContainer = document.getElementById('stepsContainer');
        panel.style.display = 'block';
        document.getElementById('ipaText').textContent = '需联网查询单词原音标';
        
        stepsContainer.innerHTML = generateAnalysisSteps(word, predefinedSplit);
        panel.scrollIntoView({ behavior: 'smooth' });
    }

    function playAudio(rate) {
        if (currentWordKeys.length === 0) return;
        const word = currentWordKeys[currentIndex];
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = rate;
            speechSynthesis.speak(u);
        }
    }

    function nextWord() {
        if (currentWordKeys.length === 0) return;
        currentIndex = (currentIndex + 1) % currentWordKeys.length;
        displayCurrentWord();
    }

    // ==========================================================
    // 六、任意单词手动解析
    // ==========================================================
    async function analyzeManualWord() {
        const word = document.getElementById('manualInput').value.trim().toLowerCase();
        if (!word) return;
        const resultDiv = document.getElementById('manualResult');
        resultDiv.style.display = 'block';
        resultDiv.innerHTML = '<p style="text-align:center; color:#888;">正在查询并解析...</p>';
        
        let ipa = '未找到';
        let meaning = '未找到';
        try {
            const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
            if (response.ok) {
                const data = await response.json();
                if (data && data.length > 0) {
                    const ph = data[0].phonetics?.find(p => p.text);
                    if (ph) ipa = ph.text;
                    const m = data[0].meanings?.[0];
                    if (m) meaning = `${m.partOfSpeech}. ${m.definitions[0].definition}`;
                }
            }
        } catch (e) {}
        
        const analysisHTML = generateAnalysisSteps(word);
        
        resultDiv.innerHTML = `
            <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #e0f7fa; padding-bottom: 15px;">
                <h2 style="font-size: 32px; color: #00796b; margin: 0 0 5px 0;">${word}</h2>
                <p style="font-size: 16px; color: #666; margin: 5px 0;">国际音标：<span class="ipa-badge" style="font-size: 16px; padding: 2px 10px;">${ipa}</span></p>
                <p style="font-size: 14px; color: #888; margin: 5px 0;">${meaning}</p>
                <div class="audio-controls" style="max-width: 300px; margin: 15px auto 0;">
                    <button class="audio-btn" onclick="playManualAudio('${word}', 1.0)">🔊 原速</button>
                    <button class="audio-btn" onclick="playManualAudio('${word}', 0.75)">🐢 0.75x</button>
                    <button class="audio-btn" onclick="playManualAudio('${word}', 0.5)">🐌 0.5x</button>
                </div>
            </div>
            ${analysisHTML}
        `;
    }

    function playManualAudio(word, rate) {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(word);
            u.lang = 'en-US'; u.rate = rate;
            speechSynthesis.speak(u);
        }
    }

    // ==========================================================
    // 七、初始化
    // ==========================================================
    window.addEventListener('load', function() {
        loadGradeList(); // 页面加载自动获取词库列表
        document.getElementById('manualInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') analyzeManualWord();
        });
    });
</script>
</body>
</html>
