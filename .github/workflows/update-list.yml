name: Update Word List

on:
  push:
    branches:
      - main
    paths:
      - 'data/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
      - name: Generate manifest.json
        run: |
          cd data
          echo "[" > manifest.json
          first=true
          for file in *.json; do
            if [ "$file" != "manifest.json" ] && [ -f "$file" ]; then
              name="${file%.json}"
              if [ "$first" = true ]; then
                first=false
              else
                echo "," >> manifest.json
              fi
              echo "{\"name\": \"$name\", \"file\": \"$file\"}" >> manifest.json
            fi
          done
          echo "]" >> manifest.json
      - name: Commit manifest.json
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add data/manifest.json
          git commit -m "Auto-update word list" || echo "No changes to commit"
          git push
